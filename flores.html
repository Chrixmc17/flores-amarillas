<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unas flores para Betsua 🌻</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bouquet-page">

  <div class="night-sky" id="nightSky"></div>

  <main class="bouquet-scene">
    <div class="bouquet-message">
      <p>Hoy no pude entregártelas personalmente...</p>
      <h1>así que dejé que crecieran aquí para ti 💛</h1>
    </div>

    <div class="bouquet-field" id="bouquetField"></div>

    <div class="bouquet-actions">
      <button class="replay-button" id="replayBouquets" type="button">
        Ver florecer otra vez ↻
      </button>

      <a href="dedicatoria.html" class="continue-bouquet hidden" id="continueBouquet">
        Seguir 💛
      </a>
    </div>
  </main>

  
  <audio id="bgMusic" loop autoplay preload="auto" src="audio/jardin_amarillo.mp3"></audio>
  <button class="music-control" id="musicControl" type="button" aria-label="Activar música">
    ♫ Música
  </button>

  <script src="js/script.js"></script>
</body>
</html>
